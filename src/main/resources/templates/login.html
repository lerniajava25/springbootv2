<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Helpdesk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="login-layout">
<section class="login-box">
    <h1>Helpdesk</h1>
    <p>Sign in to manage tickets.</p>
    <p th:if="${param.error}" class="error">Invalid username or password.</p>
    <p th:if="${param.logout}" class="success">You have been logged out.</p>
    <form th:action="@{/login}" method="post">
        <label>Username
            <input type="text" name="username" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Sign in</button>
    </form>
    <p class="hint">Testkonton: user/user, agent/agent, admin/admin</p>
</section>
</main>
</body>
</html>
